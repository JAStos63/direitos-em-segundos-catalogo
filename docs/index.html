<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direitos em Segundos — Catálogo Nacional</title><style>body{font-family:system-ui;margin:0;background:#eef3f7;color:#142535}main{max-width:900px;margin:auto;padding:24px}.card{background:white;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0001}h1{color:#143d59}code{background:#eef3f7;padding:2px 6px;border-radius:4px}li{margin:8px 0}</style></head><body><main><div class="card"><h1>Direitos em Segundos</h1><p>Catálogo nacional de legislação estadual usado pelo aplicativo Android.</p><p>Os arquivos JSON ficam na pasta <code>catalogos</code>. A atualização automática é executada pelo GitHub Actions.</p><ul id="states"></ul><p id="status">Carregando…</p></div></main><script>fetch('index.json').then(r=>r.json()).then(d=>{status.textContent='Versão '+d.catalog_version+' — '+d.states.length+' unidades federativas';states.innerHTML=d.states.map(s=>`<li><a href="${s.arquivo}">${s.uf} — ${s.estado}</a> (${s.quantidade_inicial} normas iniciais)</li>`).join('')}).catch(()=>status.textContent='Não foi possível carregar o índice.');</script></body></html>
